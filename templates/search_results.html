{% extends "base.html" %}
{% block content %}
<section class="page-section">
<div class="container">
<div class="section-header">
<h1>Search Results</h1>
<p>Results for "{{ query }}"</p>
</div>

<div class="row g-4">
{% for product in products %}
<div class="col-md-4">
<div class="product-card">
<img src="{{ url_for('static', filename='uploads/' ~ product.image) }}" class="product-image">
<h4>{{ product.name }}</h4>
<p>MWK {{ product.price }}</p>
</div>
</div>
{% endfor %}
</div>

</div>
</section>
{% endblock %}
