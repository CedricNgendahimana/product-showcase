<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Computer Aid MW{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg custom-nav">
<div class="container">
<a class="navbar-brand" href="{{ url_for('home') }}">
<div class="logo-box">C</div>
Computer Aid MW
</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="navMenu">
<ul class="navbar-nav mx-auto">
<li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Home</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('about') }}">About</a></li>
<li class="nav-item"><a class="nav-link" href="{{ url_for('view_cart') }}">Cart</a></li>
</ul>

<div class="nav-icons">
<i class="fas fa-search"></i>
<i class="fas fa-shopping-cart"></i>
</div>
</div>
</div>
</nav>

{% block content %}{% endblock %}

<footer class="footer">
<div class="container text-center">
<h3>Computer Aid MW</h3>
<p>Premium technology products and accessories.</p>
<p>Email: support@computeraidmw.com</p>
<p>Phone: +265 999 000 000</p>
</div>
</footer>

</body>
</html>
