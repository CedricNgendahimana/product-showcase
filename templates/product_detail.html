{% extends "base.html" %}
{% block content %}
<section class="page-section">
<div class="container">
<div class="content-card">
<img src="{{ url_for('static', filename='uploads/' ~ product.image) }}" class="detail-image">
<h1>{{ product.name }}</h1>
<p>{{ product.description }}</p>
<h3>MWK {{ product.price }}</h3>
<a href="{{ url_for('add_to_cart', id=product.id) }}" class="hero-btn">Add To Cart</a>
</div>
</div>
</section>
{% endblock %}
