{% extends "base.html" %}

{% block title %}Admin Login | Computer Aid MW{% endblock %}

{% block content %}

<section class="login-section">

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-5 col-md-8">

                <div class="login-card glass-card">

                    <!-- LOGO -->
                    <div class="login-header text-center">

                        <div class="login-logo">

                            <i class="fas fa-shield-alt"></i>

                        </div>

                        <span class="section-tag mt-4">
                            Admin Portal
                        </span>

                        <h1 class="login-title mt-4">
                            Welcome Back
                        </h1>

                        <p class="login-subtitle">
                            Sign in to manage your products and dashboard.
                        </p>

                    </div>

                    <!-- FORM -->
                    <form
                        method="POST"
                        action="{{ url_for('admin_login') }}"
                        class="login-form mt-5"
                    >

                        <!-- USERNAME -->
                        <div class="form-group mb-4">

                            <label class="form-label">
                                Username
                            </label>

                            <div class="input-wrapper">

                                <i class="fas fa-user"></i>

                                <input
                                    type="text"
                                    name="username"
                                    class="form-control"
                                    placeholder="Enter username"
                                    required
                                >

                            </div>

                        </div>

                        <!-- PASSWORD -->
                        <div class="form-group mb-4">

                            <label class="form-label">
                                Password
                            </label>

                            <div class="input-wrapper">

                                <i class="fas fa-lock"></i>

                                <input
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    placeholder="Enter password"
                                    required
                                >

                            </div>

                        </div>

                        <!-- REMEMBER -->
                        <div class="remember-row mb-4">

                            <label class="remember-check">

                                <input type="checkbox">

                                <span>Remember me</span>

                            </label>

                            <a href="#" class="forgot-link">
                                Forgot Password?
                            </a>

                        </div>

                        <!-- BUTTON -->
                        <button
                            type="submit"
                            class="btn btn-primary-custom w-100 login-btn"
                        >

                            <i class="fas fa-arrow-right-to-bracket me-2"></i>

                            Login

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</section>

{% endblock %}

{% block scripts %}

<style>

.login-section{
    position:relative;
    overflow:hidden;
}

.login-section::before{
    content:'';

    position:absolute;

    width:400px;
    height:400px;

    background:rgba(59,130,246,.18);

    filter:blur(100px);

    top:-100px;
    left:-100px;

    z-index:-1;
}

.login-section::after{
    content:'';

    position:absolute;

    width:320px;
    height:320px;

    background:rgba(168,85,247,.16);

    filter:blur(100px);

    bottom:-100px;
    right:-100px;

    z-index:-1;
}

.login-card{
    padding:3rem;
    border-radius:40px;
}

.login-header{
    margin-bottom:1rem;
}

.login-logo{
    width:90px;
    height:90px;

    margin:auto;

    border-radius:28px;

    background:rgba(59,130,246,.12);

    display:flex;
    align-items:center;
    justify-content:center;
}

.login-logo i{
    font-size:2rem;
    color:#60a5fa;
}

.login-title{
    font-size:2.5rem;
    font-weight:800;
}

.login-subtitle{
    margin-top:1rem;
}

.form-label{
    margin-bottom:.8rem;
    font-weight:600;
}

.input-wrapper{
    position:relative;
}

.input-wrapper i{
    position:absolute;

    top:50%;
    left:18px;

    transform:translateY(-50%);

    color:#60a5fa;
}

.input-wrapper .form-control{
    padding-left:52px;
    height:60px;
}

.remember-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:1rem;
}

.remember-check{
    display:flex;
    align-items:center;
    gap:.7rem;

    color:#cbd5e1;
}

.remember-check input{
    accent-color:#3b82f6;
}

.forgot-link{
    color:#60a5fa;
    font-size:.92rem;
}

.login-btn{
    height:60px;
    font-size:1rem;
}

@media(max-width:576px){

    .login-card{
        padding:2rem;
    }

    .login-title{
        font-size:2rem;
    }

    .remember-row{
        flex-direction:column;
        align-items:flex-start;
    }

}

</style>

{% endblock %}
